<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Progress Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Progress Tracker</h1>
    <h2>Add Student Progress</h2>
    
    <form id="progressForm">
        <label for="name">Name:</label>
        <input id="name" type="text" placeholder="Enter Name" required>
        <br/>
        <label for="courseName">Course Name:</label>
        <input id="courseName" type="text" placeholder="Enter Your Course" required>
        <br/>

        <label for="completionPercentage">Completion Percentage</label>
        <input type="number" id="completionPercentage"
        min="0"
        max="100"
        placeholder="0-100" required>
    
    <br><br> <button type="submit">Add Progress</button> 
</form> 
<a href="progress.html">Progress Page</a>
 <script src="script.js"></script>
    
</body>
</html>
